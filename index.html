<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>푸른 날개 — 비행 슈팅</title>
<style>
:root{--bg:#071b27;--panel:#132f40;--line:#32515b;--ink:#eef5ff;--muted:#95aac7;--cyan:#a4e0d0;--gold:#ffce70;--font:'Malgun Gothic',system-ui,sans-serif}*{box-sizing:border-box}html,body{overflow-x:clip}body{margin:0;background:radial-gradient(ellipse at 30% 0%,#173c51 0%,var(--bg) 65%);color:var(--ink);font-family:var(--font)}main{max-width:1100px;margin:auto;padding:22px 30px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:25px;letter-spacing:-1px;margin:0}header small{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,720px) 235px;gap:24px}canvas{width:100%;aspect-ratio:720/660;background:var(--bg);border:1px solid var(--line);border-radius:12px;display:block}aside{padding:8px 0}canvas{box-shadow:0 22px 65px #0007;border-color:#4f839366}header{padding-bottom:16px;border-bottom:1px solid #8aafb92b}h1{font-size:28px}h2{font-size:13px}.number{letter-spacing:-1px}.primary{background:linear-gradient(135deg,#c9ece6,#72c6bc);box-shadow:0 4px 22px #69bfb729}h2{font-size:15px;color:var(--muted);font-weight:400;margin:14px 0 6px}.number{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}.number span{font-size:16px;color:var(--muted)}.lives{color:var(--gold);font-size:25px;min-height:35px}button,a{font-family:var(--font)}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:12px 14px;border-radius:8px;font-size:15px}button:hover{border-color:var(--cyan)}button:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{display:block;width:100%;background:var(--cyan);color:var(--bg);font-weight:800;margin-top:22px}.secondary{width:100%;margin-top:8px}p{font-size:14px;color:var(--muted);line-height:1.9}kbd{color:var(--ink);font-family:var(--font)}.status{font-size:15px;color:var(--cyan);min-height:50px}a{color:var(--muted);font-size:13px}details{margin-top:22px;font-size:13px;color:var(--muted)}summary{cursor:pointer}details button{font-size:12px;padding:8px;margin-top:8px}.test-note{font-size:12px}@media(max-width:850px){main{min-width:800px}.layout{grid-template-columns:minmax(0,1fr) 210px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
dialog{width:min(580px,90vw);max-height:85vh;overflow:auto;border:1px solid #527b8a;border-radius:18px;background:#102b3b;color:var(--ink);padding:28px;box-shadow:0 30px 100px #0009}dialog::backdrop{background:#03101bd9;backdrop-filter:blur(7px)}dialog h2{font-size:26px;color:var(--ink);margin:0 0 12px}dialog table{width:100%;border-collapse:collapse;font-size:14px}dialog th,dialog td{text-align:left;padding:11px 7px;border-bottom:1px solid #8aafb92b}dialog th{color:var(--muted);font-size:12px}dialog tr.current{background:#a4e0d01c;color:var(--gold)}.rank-actions{display:flex;gap:10px;margin-top:20px}.rank-actions button{flex:1}#ranking-note{font-size:12px}.rank-score{font-size:28px;font-weight:800;color:var(--gold)}
canvas{touch-action:none;user-select:none;-webkit-user-select:none}select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(max-width:760px){main{min-width:0;width:100%;padding:12px}header{gap:10px;margin-bottom:10px;padding-bottom:10px}header h1{font-size:22px}header small{font-size:11px}.layout{display:flex;flex-direction:column;gap:12px}canvas{width:100%;height:auto;max-height:64svh;aspect-ratio:720/660;object-fit:contain}aside{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px;padding:0}aside h2{margin:4px 0;font-size:12px}.number{font-size:25px}.lives{font-size:21px}aside>*{grid-column:1/-1}aside .primary,aside .secondary{margin-top:2px}aside p{margin:3px 0;font-size:12px;line-height:1.5}dialog{padding:18px;width:95%;max-height:90svh}dialog h2{font-size:22px}dialog th,dialog td{font-size:11px;padding:9px 4px}.rank-score{font-size:23px}}
#touch-controls{display:none}@media(pointer:coarse),(max-width:760px){ .layout{display:flex;flex-direction:column}#touch-controls{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:10px 18px;background:#102b3be8;border:1px solid #527b8a66;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,43px);gap:3px}.touch-key{width:48px;height:48px;border-radius:50%;padding:0;font-size:21px;touch-action:none;background:#244b60;color:#eef5ff;border:1px solid #77a9ba;box-shadow:0 3px 0 #061a26}.touch-key.pressed{background:#73c7bf;color:#08212b;transform:translateY(2px)}.touch-fire{width:88px;height:88px;background:#b44f43;border-color:#ffae89;font-size:17px;font-weight:800}#touch-controls .up{grid-column:2;grid-row:1}#touch-controls .left{grid-column:1;grid-row:2}#touch-controls .right{grid-column:3;grid-row:2}#touch-controls .down{grid-column:2;grid-row:3}canvas{width:min(100%,calc(64svh * 720 / 660));align-self:center}}
</style>
<main><header><h1>푸른 날개</h1><small>v0.4 / 목숨 5개</small></header><div class="layout"><canvas id="game" width="720" height="660" tabindex="0" aria-label="비행 슈팅 게임. 방향키 이동, 스페이스바 발사, P 일시 정지"></canvas><div id="touch-controls" aria-label="휴대폰 조작키"><div class="dpad"><button class="touch-key up" data-key="ArrowUp" aria-label="위로 이동">▲</button><button class="touch-key left" data-key="ArrowLeft" aria-label="왼쪽 이동">◀</button><button class="touch-key right" data-key="ArrowRight" aria-label="오른쪽 이동">▶</button><button class="touch-key down" data-key="ArrowDown" aria-label="아래로 이동">▼</button></div><button class="touch-key touch-fire" data-key="Space" aria-label="미사일 발사">발사</button></div><aside><h2>점수</h2><div id="score" class="number">0</div><h2 id="stage-label">1탄 · 남쪽 해역</h2><div class="number"><b id="kills">0</b> <span id="goal">/ 26</span></div><h2>무기 강화</h2><p id="weapons">위력 1 / 확산 1 / 미사일 0</p><h2>남은 목숨</h2><div id="lives" class="lives">♥ ♥ ♥ ♥ ♥</div><label for="aircraft" style="display:block;font-size:13px;margin:16px 0 7px">출격 기체 선택</label><select id="aircraft" style="width:100%;padding:12px;border-radius:8px;background:#163541;color:#eef5ff;border:1px solid #527b8a;font-size:14px"><option value="balanced">청룡 — 밸런스형</option><option value="spread">홍익 — 확산형</option><option value="heavy">철갑 — 중화력형</option></select><p id="aircraft-info" style="font-size:12px">표준 속도 · 쌍발 기관포</p><button id="start" class="primary">게임 시작</button><button id="pause" class="secondary">일시 정지 (P)</button><p>휴대폰: 원형 방향키와 발사 버튼을 길게 누르세요<br><kbd>← → ↑ ↓</kbd> 비행기 이동<br><kbd>스페이스바</kbd> 발사 (길게 누르기)<br><kbd>P</kbd> 일시 정지</p><p id="status" class="status" role="status">목숨 5개로 출격! 뒤의 해역일수록 적이 강해집니다.</p><a href="cards.html">동물 카드 게임 열기</a><details><summary>수업용 검증 도구</summary><p class="test-note">승리·패배 화면을 바로 시험합니다.<br>일반 플레이 점수와 구분해주세요.</p><button id="item-test">아이템 보급 시험</button><button id="win-test">승리 판정 시험</button> <button id="lose-test">패배 판정 시험</button></details></aside></div><noscript>게임 실행에는 JavaScript가 필요합니다.</noscript></main>
<dialog id="ranking" aria-labelledby="ranking-title"><h2 id="ranking-title">이번 출격 결과</h2><p id="ranking-result" class="rank-score"></p><p id="ranking-breakdown" style="white-space:pre-line;font-size:13px"></p><p id="ranking-note"></p><table><thead><tr><th>순위</th><th>점수</th><th>진행</th><th>시간</th><th>날짜</th></tr></thead><tbody id="ranking-list"></tbody></table><div class="rank-actions"><button id="ranking-close">결과 닫기</button><button id="ranking-restart">다시 출격</button></div></dialog>
<script src="airwar.js"></script></html>
